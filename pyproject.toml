[project]
name = "tetraft"
version = "0.1.0"
description = "Quantization-Aware Fine-Tuning for 2-bit Quaternary LLMs"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

# Flat modules live at repo root (Kaggle-friendly). Put root on sys.path for tests.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
